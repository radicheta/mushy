# Drop-in for docker.service: /etc/systemd/system/docker.service.d/wait-lan-addr.conf
#
# Several containers publish ports on 10.68.155.50 specifically. network-online
# is reached as soon as enp4s0 activates on IPv6 alone, which on 2026-10-12 was
# 108s before DHCPv4 delivered that address; dockerd started in the gap and six
# containers failed to bind and stayed down (BONE-20).
#
# Wait up to 180s for the address, then start anyway: a host with no LAN lease
# should still get docker, and stack-reconcile repairs whatever failed to bind.
[Service]
ExecStartPre=/bin/sh -c 'i=0; until ip -4 -o addr show | grep -qF "inet 10.68.155.50/"; do i=$$((i+1)); [ $$i -ge 90 ] && exit 0; sleep 2; done'
