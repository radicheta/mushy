services:
  openmct:
    build:
      context: ./src/mission-control/frontend
      dockerfile: Dockerfile

  bridge:
    build:
      context: ./src/mission-control/bridge
      dockerfile: Dockerfile
    depends_on:
      - timescale
    environment:
      - ROS_DOMAIN_ID=69
      - ROS_LOCALHOST_ONLY=0
      # Set FAKE_SENSORS=1 to publish simulated data (testing without Pi)
      - FAKE_SENSORS=${FAKE_SENSORS:-0}
      - TIMESCALE_HOST=localhost
      - TIMESCALE_DB=postgres
      - TIMESCALE_USER=postgres
      - TIMESCALE_PASSWORD=${TIMESCALE_PASSWORD}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://10.68.155.50:8080}
      - SNAPSHOT_DIR=/data/snapshots
      - SNAPSHOT_BURNT_DIR=/data/snapshots-burnt
      - SNAPSHOT_INTERVAL_MIN=5
      - CAMERA_ID=fc1
      # Phase 21 retention defaults (optional; in-process daily prune)
      - RETENTION_DAYS=${RETENTION_DAYS:-365}
      - RETENTION_GRACE_DAYS=${RETENTION_GRACE_DAYS:-30}
    volumes:
      - /data/snapshots:/data/snapshots
      - /data/snapshots-burnt:/data/snapshots-burnt

  timescale:
    image: timescale/timescaledb:latest-pg14
    restart: always
    environment:
      - POSTGRES_PASSWORD=${TIMESCALE_PASSWORD}
    # Bind to localhost so the bridge (host networking) can reach it at
    # localhost:5432 without exposing Postgres to the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data

  farmos-agent:
    build:
      context: ./src/farmos-agent
      dockerfile: Dockerfile
    depends_on:
      - timescale
      - bridge
    environment:
      - FARMOS_URL=${FARMOS_URL:-http://10.68.155.50:8082}
      - FARMOS_USERNAME=${FARMOS_USERNAME}
      - FARMOS_PASSWORD=${FARMOS_PASSWORD}
      - TIMESCALE_HOST=localhost
      - TIMESCALE_PASSWORD=${TIMESCALE_PASSWORD}
      - TZ=America/Toronto
      - REPORT_TIMEZONE=America/Toronto
      - BRIDGE_URL=http://localhost:8081
    volumes:
      - /data/snapshots:/data/snapshots:ro
    restart: unless-stopped

  timelapse:
    build:
      context: ./src/mission-control/timelapse
      dockerfile: Dockerfile
    depends_on:
      - timescale
    environment:
      - TIMESCALE_HOST=localhost
      - TIMESCALE_PASSWORD=${TIMESCALE_PASSWORD}
      - SNAPSHOT_DIR=/data/snapshots
      - TIMELAPSE_DIR=/data/timelapse
      - CAMERA_ID=fc1
      - TIMELAPSE_FPS=${TIMELAPSE_FPS:-12}
      - TZ=America/Toronto
      - PORT=8888
    volumes:
      - /data/snapshots:/data/snapshots:ro
      - /data/timelapse:/data/timelapse
    restart: unless-stopped

  # Phase 25: dedicated GPU transcription sibling for the alerter.
  # Lazy-loads faster-whisper medium fp16 (~3GB VRAM held warm). V12 mitigation:
  # rejects audio_paths that don't resolve under /data/signal-capture (also RO mount).
  whisper-transcribe:
    build:
      context: ./src/whisper-transcribe
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - WHISPER_MODEL=medium
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=float16
      - ALLOWED_ROOT=/data/signal-capture
    volumes:
      - /data/signal-capture:/data/signal-capture:ro   # V13: read-only audio access
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  timescale-data:
