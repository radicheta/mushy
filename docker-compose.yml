version: '3.8'

services:
  openmct:
    build:
      context: ./src/mission-control/frontend
      dockerfile: Dockerfile

  bridge:
    build:
      context: ./src/mission-control/bridge
      dockerfile: Dockerfile
    environment:
      - ROS_DOMAIN_ID=69
      - ROS_LOCALHOST_ONLY=0
      # Set FAKE_SENSORS=1 to publish simulated data (testing without Pi)
      - FAKE_SENSORS=${FAKE_SENSORS:-0}
