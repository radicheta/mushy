# Host networking: bridge reaches Pi's DDS via WireGuard (wg0, domain 69)
# With host networking, port mappings are ignored — services bind directly.
services:
  openmct:
    network_mode: "host"
    restart: always

  bridge:
    network_mode: "host"
    restart: always
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
      # Phase 999.1 buffer-replay endpoint — points at fc1's WG IP (was 100.96.239.75 / Tailscale, retired 2026-05-03)
      - FC1_BUFFER_URL=http://172.16.10.5:8765
      # Phase 33 D-09: bridge dispatches /heartbeat-alert via signal-cli on host loopback
      # (signal-cli ports: 127.0.0.1:8085:8080 in this same file).
      - SIGNAL_API_URL=${SIGNAL_API_URL:-http://localhost:8085}
      - SIGNAL_SENDER=${SIGNAL_SENDER}
      - SIGNAL_RECIPIENT=${SIGNAL_RECIPIENT}
      # Derived-telemetry chamber geometry: FC-1 = 120 x 240 x 200 cm = 5.76 m^3.
      # Drives the "Water in air" (water-vapor mass) metric in fc_derived.js.
      - FC_CHAMBER_VOLUME_M3=${FC_CHAMBER_VOLUME_M3:-5.76}
    volumes:
      - /home/santi/.config/cyclonedds.xml:/etc/cyclonedds.xml:ro
      - /data/snapshots-burnt:/data/snapshots-burnt
      # Phase 999.1 Plan 03: bridge-side buffer-replay state (last_ingested_ns).
      # Loss is recoverable (one extra 24h refetch) but graceful — survives
      # `docker compose up -d --build bridge`. Source dir created by deploy.
      - ./bridge-state:/var/lib/bridge

  farmos-agent:
    network_mode: "host"

  timelapse:
    network_mode: "host"

  whisper-transcribe:
    network_mode: "host"

  # signal-cli-rest-api: Signal primary-account host
  # MODE=normal: /v1/receive is HTTP GET (not WebSocket). Required for receive-loop HTTP polling.
  # Primary registration required (device_id=1); linked-secondary cannot use /v1/receive.
  # Account state persists in named volume — survive container recreation.
  # Internal only: NOT published to host, NOT Tailscale-served (D-13).
  signal-cli:
    # 2026-07-26: bumped 0.200-dev (signal-cli 0.14.2) -> 0.100 (signal-cli 0.14.5).
    # Signal enforced SPQR on 2026-03-06 and unregisters accounts on clients that
    # lack it; +59891840205 was killed server-side 2026-07-19 02:43Z and re-register
    # 403'd until the client was current. Upstream AsamK/signal-cli#1993.
    image: bbernhard/signal-cli-rest-api:0.100
    restart: unless-stopped
    environment:
      - MODE=normal
    # Phase 33 D-09: bind to host loopback so the bridge (network_mode: host)
    # can reach signal-cli for /heartbeat-alert dispatch. The alerter still
    # reaches it on the signal-net compose network at signal-cli:8080.
    # 127.0.0.1 only — NOT exposed to LAN or wg-hub.
    ports:
      - "127.0.0.1:8085:8080"
    volumes:
      - signal-cli-data:/home/.local/share/signal-cli
    networks:
      - signal-net

  # alerter: mushy-alerter Signal notification agent
  # Reaches bridge via host.docker.internal:8081 (extra_hosts, no compose network needed).
  # Reaches signal-cli via signal-net internal compose network at signal-cli:8080.
  alerter:
    build:
      context: ./src/agents/alerter
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - signal-cli
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Phase 44-06 (path B): tenant-scoped secrets live in tenants/mossrock/secrets.env
    # (gitignored). The file holds ANTHROPIC_API_KEY, FARMOS_PASSWORD, SIGNAL_SENDER.
    # The three keys were intentionally REMOVED from the `environment:` block below
    # because docker-compose `environment:` mappings override `env_file:` values —
    # leaving them would shadow the tenant-scoped secrets with whatever happens to
    # be (or not be) in repo-root .env. Root .env still holds SIGNAL_SENDER and
    # FARMOS_PASSWORD for the bridge and farmos-agent services until they migrate
    # to per-tenant secrets in v1.9 (see 44-06-SUMMARY.md "v1.9 cleanup carryovers").
    env_file:
      # 2026-05-23 hotfix: simple string form for compose v2.40 — the object form
      # (`- path: ... required: false`) parses to env_file:None silently on this
      # version, so the alerter never received SIGNAL_SENDER / ANTHROPIC_API_KEY /
      # FARMOS_PASSWORD and crash-looped on boot. Returning to the simple list
      # form keeps behaviour explicit; the file must exist on hosts running this
      # service (gitignored, operator-provisioned per Plan-06 path B).
      - tenants/mossrock/secrets.env
    environment:
      - BRIDGE_WS_URL=${BRIDGE_WS_URL:-ws://host.docker.internal:8081}
      - BRIDGE_HEALTH_URL=${BRIDGE_HEALTH_URL:-http://host.docker.internal:8081/health}
      - SIGNAL_API_URL=http://signal-cli:8080
      - SIGNAL_RECIPIENT=${SIGNAL_RECIPIENT}
      - SIGNAL_ADDITIONAL_SENDERS=${SIGNAL_ADDITIONAL_SENDERS}
      # Phase 37 D-04/D-16 — operator-set in repo-root .env. Absence = back-compat DM-only.
      - SIGNAL_GROUP_ID=${SIGNAL_GROUP_ID}
      # Phase 37 D-11 — "+phone:slug,+phone:slug,..." map for farmOS person attribution.
      - SIGNAL_FARMER_MAP=${SIGNAL_FARMER_MAP}
      - KNOWN_GOOD_PATH=/opt/scripts/signal/known-good-identity.json
      - ALERT_RH_TARGET=${ALERT_RH_TARGET:-90}
      - ALERT_RH_BAND=${ALERT_RH_BAND:-3}
      - ALERT_OOB_N=${ALERT_OOB_N:-5}
      - ALERT_OOB_WINDOW_MIN=${ALERT_OOB_WINDOW_MIN:-3}
      - ALERT_COOLDOWN_MIN=${ALERT_COOLDOWN_MIN:-30}
      - ALERT_CRITICAL_COOLDOWN_MIN=${ALERT_CRITICAL_COOLDOWN_MIN:-60}
      - ALERT_PI_OFFLINE_MIN=${ALERT_PI_OFFLINE_MIN:-5}
      # 2026-05-06 hotfix: default raised from 5 → 1440 to disable the alerter-side
      # sensor watchdog. fc_controller publishes /fc1/sensor_health only on flips, so
      # the 10-min watchdog tripped on a stable SHT30 and re-fired hourly via critical
      # cooldown. Pi-authoritative `sht30_fresh==='false'` path still detects real
      # failures. Revert when 999.35 (maintenance agent) or a controller heartbeat lands.
      - ALERT_SENSOR_OFFLINE_MIN=${ALERT_SENSOR_OFFLINE_MIN:-1440}
      # 999.42 per-sensor enable flags. SHT30 physically disconnected since 2026-04-11;
      # operator sets ALERT_SHT30_ENABLED=false in repo-root .env to mute its watchdog
      # without the blanket sensorOfflineMin=1440 band-aid (which also masked SCD41 outages).
      # Pre-fix omission caused hourly false-alarm spam to the farmer group 2026-05-12.
      - ALERT_SHT30_ENABLED=${ALERT_SHT30_ENABLED:-true}
      - ALERT_SCD41_ENABLED=${ALERT_SCD41_ENABLED:-true}
      # 2026-05-12: Pi-flag flap floor. Suppresses sub-N-second freshness flips
      # (e.g. 6s I2C glitches that previously fired "CO2 Sensor offline 0m 06s"
      # alarms). Slow-silence (sensorOfflineMin) path unchanged.
      - ALERT_SENSOR_FLAP_MIN_SEC=${ALERT_SENSOR_FLAP_MIN_SEC:-60}
      - ALERT_HUMIDIFIER_STUCK_MIN=${ALERT_HUMIDIFIER_STUCK_MIN:-30}
      - ALERT_HEARTBEAT_HOUR=${ALERT_HEARTBEAT_HOUR:-8}
      - ALERT_RECEIVE_POLL_SEC=${ALERT_RECEIVE_POLL_SEC:-30}
      - DASHBOARD_URL=${DASHBOARD_URL:-http://100.96.10.66:8080/}
      # The farm is in Uruguay (UYT, UTC-3). Toronto was a Phase-13 scaffolding
      # default and made node-cron schedules + ALERT_HEARTBEAT_HOUR fire an hour
      # late in local terms. Safe on non-UTC only because node-cron is pinned
      # ^3.0.3 -- 4.x breaks on non-UTC TZ. Matches alerter-py below.
      - TZ=${TZ:-America/Montevideo}
      # Phase 25 capture pipeline env (consumed by capture-db, transcribe-client, llm-client)
      # TIMESCALE_HOST=timescale resolves via the default compose network (alerter joins it below).
      # host.docker.internal won't work because timescale binds 127.0.0.1:5432 on the host.
      - TIMESCALE_HOST=${TIMESCALE_HOST:-timescale}
      - TIMESCALE_DB=${TIMESCALE_DB:-postgres}
      - TIMESCALE_USER=${TIMESCALE_USER:-postgres}
      - TIMESCALE_PASSWORD=${TIMESCALE_PASSWORD}
      - WHISPER_URL=${WHISPER_URL:-http://host.docker.internal:8090}
      # ANTHROPIC_API_KEY now sourced from tenants/mossrock/secrets.env (env_file above).
      - CAPTURE_BASE_PATH=${CAPTURE_BASE_PATH:-/data/signal-capture}
      - BRIDGE_HTTP_URL=${BRIDGE_HTTP_URL:-http://host.docker.internal:8081}
      - CAPTURE_RETENTION_DAYS=${CAPTURE_RETENTION_DAYS:-30}
      - CAPTURE_RETENTION_CRON=${CAPTURE_RETENTION_CRON:-15 3 * * *}
      # Phase 39 (D-03a, D-04..D-04c): confirm-loop timeouts + edit cap.
      - DRAFT_PENDING_TIMEOUT_MIN=${DRAFT_PENDING_TIMEOUT_MIN:-30}
      - DRAFT_NUDGE_FRACTION=${DRAFT_NUDGE_FRACTION:-0.8}
      - DRAFT_WATCHDOG_INTERVAL_MS=${DRAFT_WATCHDOG_INTERVAL_MS:-60000}
      - MAX_EDIT_TURNS=${MAX_EDIT_TURNS:-3}
      # Phase 40 (D-01b, D-07, D-07a): farmOS write path + commit watchdog.
      # Dev FARMOS_URL points at port 18080 (P2 dev stack); prod switch is env-flip per 40-RUNBOOK.
      - FARMOS_URL=${FARMOS_URL:-http://10.68.155.50:18080}
      - FARMOS_USERNAME=${FARMOS_USERNAME}
      # FARMOS_PASSWORD now sourced from tenants/mossrock/secrets.env (env_file above).
      - COMMIT_WATCHDOG_INTERVAL_MS=${COMMIT_WATCHDOG_INTERVAL_MS:-30000}
      - COMMIT_WATCHDOG_BATCH_CAP=${COMMIT_WATCHDOG_BATCH_CAP:-10}
      - COMMIT_RETRY_MAX=${COMMIT_RETRY_MAX:-3}
      - COMMIT_RETRY_BACKOFF_MS=${COMMIT_RETRY_BACKOFF_MS:-1000,4000,16000}
      - COMMIT_LOCK_STALE_MIN=${COMMIT_LOCK_STALE_MIN:-5}
      - FARMOS_INTEGRATION=${FARMOS_INTEGRATION:-0}
    volumes:
      - /data/signal-capture:/data/signal-capture
      - ./scripts/signal:/opt/scripts/signal:ro
    healthcheck:
      # Phase 36 D-10/D-14 — verifies signal-cli identity-trust integrity across
      # alerter rebuilds. exit=0 verdict=ok/recovered, exit=1 verdict=hard_mismatch
      # (container marked unhealthy; restart policy `unless-stopped` does NOT restart).
      test: ["CMD", "/opt/scripts/signal/post-rebuild-trust-check.sh"]
      interval: 5m
      timeout: 15s
      retries: 2
      start_period: 60s
    networks:
      - signal-net
      - default

  # alerter-py: Python port of mushy-alerter (farm-agent, FND-01).
  # Coexists with the live Node `alerter` service until Phase 65 cutover.
  # Shares no files with alerter; touches the shared TimescaleDB only via the
  # additive migrations from Plan 05 (T-56-06-03 mitigation).
  alerter-py:
    build:
      context: ./src/farm-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      # 2026-06-15: simple STRING form for compose v2.40 -- the object form
      # (`- path: ... required: false`) parses to env_file:None silently on
      # this version, so secrets never arrive and the container crash-loops.
      # Mirrors the same hotfix comment in the alerter: block above (2026-05-23).
      - tenants/mossrock/secrets.env
    environment:
      # ANTHROPIC_API_KEY is sourced from tenants/mossrock/secrets.env (env_file above).
      # Do NOT add it here -- that would override the per-tenant secret with whatever
      # is in repo-root .env, repeating the 2026-05-23 alerter outage pattern.
      - TENANT_ID=mossrock
      - TIMESCALE_HOST=${TIMESCALE_HOST:-timescale}
      - TIMESCALE_DB=${TIMESCALE_DB:-postgres}
      - TIMESCALE_USER=${TIMESCALE_USER:-postgres}
      - TIMESCALE_PASSWORD=${TIMESCALE_PASSWORD}
      - SIGNAL_RECIPIENT=${SIGNAL_RECIPIENT}
      - SIGNAL_ADDITIONAL_SENDERS=${SIGNAL_ADDITIONAL_SENDERS}
      - SIGNAL_GROUP_ID=${SIGNAL_GROUP_ID}
      - SIGNAL_FARMER_MAP=${SIGNAL_FARMER_MAP}
      - ALERT_RH_TARGET=${ALERT_RH_TARGET:-90}
      - ALERT_RH_BAND=${ALERT_RH_BAND:-3}
      - ALERT_PI_OFFLINE_MIN=${ALERT_PI_OFFLINE_MIN:-5}
      - ALERT_SENSOR_OFFLINE_MIN=${ALERT_SENSOR_OFFLINE_MIN:-1440}
      - ALERT_HEARTBEAT_HOUR=${ALERT_HEARTBEAT_HOUR:-8}
      - ALERT_RECEIVE_POLL_SEC=${ALERT_RECEIVE_POLL_SEC:-30}
      - ALERT_MAX_SENDS_PER_HOUR=${ALERT_MAX_SENDS_PER_HOUR:-20}
      - FARMOS_URL=${FARMOS_URL:-http://10.68.155.50:18080}
      - FARMOS_USERNAME=${FARMOS_USERNAME}
      - FARMOS_INTEGRATION=${FARMOS_INTEGRATION:-0}
      - DRAFT_PENDING_TIMEOUT_MIN=${DRAFT_PENDING_TIMEOUT_MIN:-30}
      - DRAFT_WATCHDOG_INTERVAL_MS=${DRAFT_WATCHDOG_INTERVAL_MS:-60000}
      - COMMIT_WATCHDOG_INTERVAL_MS=${COMMIT_WATCHDOG_INTERVAL_MS:-30000}
      - COMMIT_WATCHDOG_BATCH_CAP=${COMMIT_WATCHDOG_BATCH_CAP:-10}
      - COMMIT_RETRY_MAX=${COMMIT_RETRY_MAX:-3}
      - WHISPER_URL=${WHISPER_URL:-http://host.docker.internal:8090}
      - CAPTURE_BASE_PATH=${CAPTURE_BASE_PATH:-/data/signal-capture}
      - CAPTURE_RETENTION_DAYS=${CAPTURE_RETENTION_DAYS:-30}
      - TZ=${TZ:-America/Montevideo}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - signal-net
      - default

networks:
  signal-net:
    driver: bridge

volumes:
  signal-cli-data:
