[project]
name = "farm-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.45",
    "pydantic>=2.13",
    "psycopg[binary]>=3.3",
    "psycopg-pool>=3.3",
    "ruamel.yaml>=0.19",
    "httpx>=0.28",
    "python-ulid>=3.1",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.15",
    "import-linter>=2.11",
    "respx>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live_fire: real-API operator-run validation; skipped unless ANTHROPIC_API_KEY + (GATE_LIVE_FIRE or EXTRACTION_LIVE_FIRE)=1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
