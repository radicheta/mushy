/**:
  ros__parameters:
    # Simulation mode (can be set independently per subsystem)
    sensor_simulation_mode: false   # false = read real SHT30 hardware (I2C)
    actuator_simulation_mode: false  # false = real GPIO for SSR + PWM

    # Sensor config
    sht30_i2c_address: 0x44  # SHT30 I2C address (bus auto-detected by adafruit_blinka)
    scd41_enabled: true       # SCD41 CO2/temp/humidity sensor on I2C 0x62

    # Actuator pins
    humidifier_pin: 27  # GPIO27 (pin 13) for humidifier SSR — pin 14 (GND) adjacent
    light_pin: 18  # GPIO18 for light control
    
    # Target values
    target_temp: 23.0  # °C
    target_humidity: 0.96  # 96% — farmer-set 2026-05-04 during PID calibration session 2
    target_light_hours: 12  # Hours of light per day
    light_start_hour: 6  # Start light at 6 AM
    
    # Tolerances
    temp_tolerance: 1.0  # °C
    humidity_tolerance: 0.005  # 0.5% — narrowed 1.5%→0.5% 2026-06-21 (calibration): defines the quadratic-feather band half-width. Tighter band + gentle feathered climb replaces the wide deadband + slam at the floor.
    
    # Control parameters
    min_fan_speed: 50  # Minimum fan speed percentage
    fan_temp_scale: 20  # Fan speed scaling factor
    fan_pwm_channel: 0  # Hardware PWM channel for fan
    fan_pwm_freq: 25000  # Fan PWM frequency in Hz
    
    # Timing
    sensor_read_interval: 2.0  # Seconds between sensor reads
    control_interval: 1.0  # Seconds between control updates
    display_interval: 1.0  # Seconds between display updates

    # PID gains (Phase 27 — Skogestad SIMC defaults from 2026-04-11 calibration; error in %RH, output 0.0–1.0)
    pid_kp: 0.36  # 0.5 → 0.35 2026-05-04 (calibration session 2); nudged 0.35 → 0.36 live 2026-05-12 — persisted
    pid_ki: 0.001  # halved from 0.002 → 0.001 2026-05-04 to address ~28-min integrator-driven limit cycle observed during afternoon falling-temp regime
    pid_kd: 4.0
    pid_derivative_filter_tau: 60.0  # 10→60 2026-05-12 to suppress PWM-period (120s) ripple in derivative term — duty was tracking its own PWM-induced RH wiggle
    pid_integrator_decay_tau: 300.0  # 999.49 — in-band I decay; 1200→300 2026-05-12 to break ~20min limit cycle (decay tau was resonating with chamber thermal response)
    pid_setpoint_ramp_seconds: 30.0  # D-07
    bypass_threshold: 0.05            # D-10 — Mode C entry; 2.5%→5% 2026-06-21 (calibration): reserve full-ON open-loop for genuine crashes (RH < ~90.5%), let the feathered PID own normal dips
    # Slow-PWM (fc_pwm_driver — Phase 27)
    pwm_window_seconds: 480.0         # D-08 unlocked 2026-08-26 (MUSHY-116): 120->480.
                                      # 720 windows/day -> 180, so relay edges drop ~400/day -> <=180.
                                      # Measured chamber RH decay with the humidifier off is 0.07 %RH/min
                                      # (worst 0.15) so the 6.4 min OFF leg at ~20% duty ripples ~0.5 %RH
                                      # (worst ~1.0) inside the +/-1.5 %RH fruiting band.
                                      # Side effect: min-pulse duty floor falls 10/120=8.3% -> 10/480=2.1%,
                                      # so the feather's gentle-trim region is now directly expressible.
    min_pulse_seconds: 30.0           # D-11 unlocked 2026-08-26 (MUSHY-116): 10->30.
                                      # The 10s figure was the farmer's fog-visibility floor, but it was
                                      # measured THROUGH the ~6s pipe dead time: a 10s pulse is only 40%
                                      # efficient at the outlet (~4s of vapour). A 30s pulse is 80%.
                                      # REQUIRES accumulate_subthreshold below. At the 480s window the
                                      # 30s floor is a 6.25% duty floor, and the chamber's equilibrium
                                      # command is also 6.25% — without banking, delivery is a CLIFF at
                                      # exactly the operating point (6.25%->4.97%, 6.24%->0.00%), which
                                      # manufactures a limit cycle. With banking the curve is continuous.
    accumulate_subthreshold: true     # MUSHY-116 — REQUIRED by min_pulse_seconds: 30 above, do not
                                      # disable one without the other. Banks commanded duty too small to
                                      # express as a legal pulse and spends it as one full-length pulse
                                      # once a pulse's worth accrues; mean duty is preserved and no pulse
                                      # shorter than min_pulse is ever emitted. Below the floor this is
                                      # worth 143 cycles/day vs 179 and 3.97% delivered vs 3.73%.
    # D-12 cap horizon at the 480s window: _duty_history is sized ceil(300/window),
    # so maxlen collapses to 1 and the cap forecasts over n+1 = 16 min, not 8.
    # Mode C crash recovery therefore runs up to 14.4 min continuous relay ON
    # (was 5.4) and recovers slower in mean terms (78.7% vs 87.9% over the first
    # hour). ACCEPTED 2026-08-26 as a fair price for the steady-state wear and
    # efficiency gains -- decision, not oversight. Do not "fix" this without
    # revisiting that call. See MUSHY-116.
    max_duty_5min_avg: 0.90           # D-12 — rolling 5-min duty cap (raised 0.40→0.90 2026-05-02 after blackout-recovery RH stuck at 79% with PID demanding duty=1.0; see 999.x backlog re: cap-aware recovery mode)
    duty_topic_timeout_seconds: 5.0   # defensive OFF if duty subscription silent

    # Safety guards
    sensor_stale_timeout: 10.0  # Seconds — sensor data older than this triggers safe state (humidifier OFF)
    startup_grace_period: 20.0  # Seconds — post-boot grace window; controller takes no actuator action until BOTH this elapses AND _humidity_buffer is full (SENS-01 / Phase 15)

    # Camera parameters (Phase 08)
    camera_simulation_mode: false   # true = no USB webcam needed; false = capture from /dev/videoN
    camera_device: 0                # /dev/video0
    camera_width: 640               # pixels (D-05: 640x480 default)
    camera_height: 480              # pixels
    camera_fps: 0.000278            # ~1 frame/hour — idle rate when no viewers (Phase 12 D-02). Active rate set by camera_active_fps.
    camera_jpeg_quality: 65         # 0-100 (D-06: 60-70% default)
    camera_active_fps: 1.0            # FPS when Mission Control viewers are connected (Phase 12 D-01)
    camera_subscriber_grace_sec: 5.0  # Seconds before dropping to idle after last viewer disconnects (Phase 12 D-07)

# Phase 999.1: edge buffer (fc_buffer node) — local SQLite ring + HTTP /telemetry/since
fc_buffer:
  ros__parameters:
    db_path: /var/lib/fc-core/buffer.sqlite
    http_bind: 172.16.10.5        # fc1 wg0 — never bind 0.0.0.0 (D-09); switched from 100.96.239.75 (tailscale0) on 2026-05-03
    http_port: 8765
    retention_seconds: 86400      # 24h ring (D-05)
    prune_interval_seconds: 60.0  # Pruner cadence
    # topics_config intentionally omitted — resolved from package share at startup

# Phase 28: Mode primitive (D-01..D-06). Dotted-key flat params per D-03 — rclpy has no
# native dict params; adding a NEW named mode beyond fruiting/pinning is a deploy in v0.
# Active mode resolves to ModeView in fc_controller._resolve_active_mode (plan 03).
fc_controller:
  ros__parameters:
    active_mode: fruiting
    # Fruiting v0 — D-05 — preserves Phase 27 HUMID-04 narrow-band PID behavior
    # Band centered on the target: the quadratic feather anchors error=0 at the
    # midpoint, so the chamber settles ~midpoint (feather-up vs passive-drying-down).
    # 2026-06-27: farmer lowered RH target 0.96→0.90; band [0.945,0.975]→[0.885,0.915]
    # (width 0.03 preserved). Was live on fc1/prod runtime overlay first; forward-ported here.
    modes.fruiting.target_humidity: 0.90
    modes.fruiting.band_low: 0.885
    modes.fruiting.band_high: 0.915
    modes.fruiting.defend_side: both
    modes.fruiting.t_target: .nan
    # Pinning v0 — D-06 — passive only; defends floor 0.90 only, ceiling 0.99 silent (D-07)
    modes.pinning.target_humidity: 0.85
    modes.pinning.band_low: 0.90
    modes.pinning.band_high: 0.99
    modes.pinning.defend_side: low
    modes.pinning.t_target: .nan
    # Phase 31 D-01: force-* modes are timed override modes.
    # Wide-open bands (band_low=0.0, band_high=1.0) are intentional —
    # alerter defended-edge rule (Phase 28 D-21) sees these bands and
    # cannot fire during a force experiment, satisfying D-32 without
    # alerter changes. force_duty short-circuits PID + Mode C in
    # control_loop (31-02): 1.0 = continuous-on, 0.0 = continuous-off.
    # Entry into either mode is gated by start_experiment service (D-03);
    # plain set_mode rejects them.
    modes.force-condensation.target_humidity: 1.0
    modes.force-condensation.band_low: 0.0
    modes.force-condensation.band_high: 1.0
    modes.force-condensation.defend_side: both
    modes.force-condensation.t_target: .nan
    modes.force-condensation.force_duty: 1.0
    modes.force-evaporation.target_humidity: 0.0
    modes.force-evaporation.band_low: 0.0
    modes.force-evaporation.band_high: 1.0
    modes.force-evaporation.defend_side: both
    modes.force-evaporation.t_target: .nan
    modes.force-evaporation.force_duty: 0.0
    # Phase 30 SCHED-01/03 — time-of-day mode schedule.
    # JSON-encoded list of {start, end, mode} windows with HH:MM local times.
    # Empty array = scheduling disabled (single-mode fallback per SCHED-03).
    # Edit live via POST /control/param; persist via POST /control/persist.
    # Wraparound supported (end<start = crosses midnight); half-open [start,end).
    schedule_windows: "[]"
    # Phase 29 ALRT-10 (D-08) — tuned values from 29-COOLDOWN-TUNING.md (2026-05-08).
    # W8 retention gate triggered (12.6h window vs 14d target); values are best-effort
    # anchored on observed clockwork-30 pattern + farmer-attested settings + CONTEXT D-05/D-09.
    # Phase 29 Tier B — per-mode alerter overrides (D-05).
    modes.fruiting.alerter.cooldown_min:          45   # 30→45 to break observed clockwork-30 pattern
    modes.fruiting.alerter.critical_cooldown_min: 75   # critical:standard ratio held at ~1.67
    modes.fruiting.alerter.humidifier_stuck_min:  30   # narrow band → fast incident, keep tight
    modes.fruiting.alerter.oob_n:                 5
    # 2026-05-12: 3→8 to honor "don't bother me for little things". Don Santiago
    # doesn't care about <~8min RH drifts in fruiting; band defense + PID handle
    # transients without needing a Signal ping. Same intent as the mooted env
    # band-aid ALERT_OOB_WINDOW_MIN=8 (Phase 29 Tier B wins over env).
    modes.fruiting.alerter.oob_window_min:        8
    modes.pinning.alerter.cooldown_min:           75   # pinning > fruiting prevents D-09 swap-spam
    modes.pinning.alerter.critical_cooldown_min:  120
    modes.pinning.alerter.humidifier_stuck_min:   75   # pinning intentionally swings (D-05)
    modes.pinning.alerter.oob_n:                  5
    modes.pinning.alerter.oob_window_min:         5
    # Phase 29 Tier C — global liveness/cadence (runtime-mutable via SetParameters).
    pi_offline_min:     15  # 5→15 absorbs wg0/DERP reconnect flaps
    sensor_offline_min: 20  # validator cap [1,60] forces dropping .env band-aid 1440;
                            # safe ONLY after 29-04+29-05 freshness gate (CONTEXT D-04)
    heartbeat_hour:     17  # honor farmer-attested .env setting (was 8 in 29-03 bootstrap)
    max_sends_per_hour: 20